{
  "mainClass": "files.Main",
  "version": "1.0.0",
  "name": "MyOS File Manager",
  "description": "Java file manager for MyOS",
  "nativeImage": {
    "enableAllSecurityServices": true,
    "enableHttp": false,
    "enableHttps": false,
    "noServer": true,
    "noFallback": true,
    "static": true,
    "reportUnsupportedElementsAtRuntime": true,
    "initializeAtBuildTime": [
      "toolkit",
      "files"
    ],
    "initializeAtRunTime": [
      "java.lang.System",
      "java.io.File",
      "java.nio.file.Files"
    ],
    "bundles": [],
    "resources": {
      "includes": [
        "META-INF/**"
      ]
    }
  }
}